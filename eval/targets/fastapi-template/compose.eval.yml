# Overrides applied on top of the template's compose.yml for eval runs.
services:
  backend:
    # Only the backend is published; it serves both the frontend and the API.
    ports:
      - "8000:8000"
    # Neither of the template's compose files runs prestart.sh (migrations and
    # the first superuser), so run it on every start; it is safe to repeat.
    # One worker keeps recordings simple and the container light.
    command:
      - bash
      - -c
      - bash scripts/prestart.sh && exec fastapi run --workers 1
    # Send email to Mailcatcher (SMTP_HOST is in eval.env). The template's
    # compose.yml doesn't pass the port or TLS setting, so set them here.
    environment:
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
    depends_on:
      - mailcatcher

  # Catches outgoing email so the recording script can follow reset links.
  # Only its web UI/API is published; SMTP stays inside the Compose network.
  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
